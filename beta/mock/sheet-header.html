<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시트 헤더 제안 목업</title>
<style>
:root{--ink:#16213A;--sub:#77736d;--line:#E6E1D6;--brass:#A07D3B;--brassF:#8A6A2C;--navy:#16213A;--soft:#F1E8D4;--paper:#F7F5F0}
*{box-sizing:border-box}
body{margin:0;background:#cfcbc2;font-family:-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}
.top{padding:10px 14px 4px;font-size:12px;color:#4a463f;max-width:420px;margin:0 auto}
.ctl{display:flex;gap:6px;padding:0 14px 8px;max-width:420px;margin:0 auto}
.ctl button{flex:1;min-height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;font:inherit;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
.ctl button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ctl.two button{flex:none;padding:0 14px}
.sheet{background:#fff;max-width:420px;margin:0 auto;border-radius:20px 20px 0 0;min-height:560px;box-shadow:0 -8px 30px rgba(0,0,0,.2);position:relative}
.grab{width:40px;height:4px;background:#cbd5e1;border-radius:2px;margin:0 auto;position:relative;top:7px}
.x{position:absolute;top:2px;right:2px;width:44px;height:44px;border:0;background:none;font-size:22px;color:#94a3b8;cursor:pointer}
.nm{font-size:16px;font-weight:800;color:var(--ink)}
.meta{font-size:12px;color:var(--sub)}
.price{font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.old{font-size:11px;color:var(--sub)}
.badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;background:var(--soft);color:#6b5320;white-space:nowrap}
.badge.dn{background:#E7F5EC;color:#15803D}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs div{flex:1;text-align:center;padding:10px 0;font-size:13.5px;color:var(--sub);border-bottom:2px solid transparent}
.tabs div.on{color:var(--navy);font-weight:800;border-color:var(--brass)}
.tabs div.dim{color:#cbd5e1}
.bd{padding:14px 16px}
.bd h4{margin:0 0 8px;font-size:15px}
.seg{display:flex;gap:7px}
.seg button{flex:1;min-height:44px;font:inherit;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--ink)}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.lab{margin:10px 16px 0;font-size:11px;color:var(--sub)}
/* A */
.hA{padding:12px 16px 10px}
.hA .r1{display:flex;align-items:flex-start;gap:8px;padding-right:34px}
.hA .meta{margin-top:1px}
.hA .r2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.hA .price{font-size:24px}
/* B */
.hB{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hB .l{min-width:0}
.hB .r{text-align:right}
.hB .price{font-size:22px}
.hB .r .badge{display:inline-block;margin-top:4px}
.hB .l .meta{margin-top:2px}
/* C */
.hC{padding:12px 16px 10px;padding-right:48px}
.hC .row{display:flex;align-items:center;gap:10px}
.hC .price{font-size:26px}
.hC .info{margin-top:4px;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hC .info b{color:var(--ink);font-weight:700}
.note{max-width:420px;margin:10px auto 24px;padding:0 14px;font-size:12px;color:#4a463f;line-height:1.55}
</style></head><body>
<div class="top">목업 · 시트 머리 정돈 제안 (393px 폭 기준). 시안과 상태를 눌러 비교하세요.</div>
<div class="ctl" id="vctl"><button class="on" data-v="A">A 이름 위 · 가격 아래</button><button data-v="B">B 좌우 분할</button><button data-v="C">C 가격 먼저</button></div>
<div class="ctl two" id="sctl"><button class="on" data-s="0">변경 없음</button><button data-s="1">약정 변경함 (−1,000)</button></div>
<div class="sheet" id="sheet"></div>
<div class="note" id="note"></div>
<script>
var view='A', chg=0;
function price(){return chg?'36,400원/월':'37,400원/월';}
function oldTxt(){return chg?'<div class="old">현재 입력 월 37,400원 →</div>':'';}
function badge(){return chg?'<span class="badge dn">현재 입력 대비 −1,000원</span>':'<span class="badge">변경 없음</span>';}
function head(){
  if(view==='A') return '<div class="hA"><div class="r1"><div><div class="nm">노블 공기청정기2</div><div class="meta">AP-1623M · 신규</div></div></div>'
    +'<div class="r2"><div>'+oldTxt()+'<div class="price">'+price()+'</div></div>'+badge()+'</div></div>';
  if(view==='B') return '<div class="hB"><div class="l"><div class="nm">노블 공기청정기2</div><div class="meta">AP-1623M · 신규</div>'+(chg?'<div class="old" style="margin-top:6px">현재 입력 월 37,400원 →</div>':'')+'</div>'
    +'<div class="r"><div class="price">'+price()+'</div>'+badge()+'</div></div>';
  return '<div class="hC"><div class="row"><div class="price">'+price()+'</div>'+badge()+'</div>'
    +(chg?'<div class="old" style="margin-top:2px">현재 입력 월 37,400원 →</div>':'')
    +'<div class="info"><b>노블 공기청정기2</b> · AP-1623M · 신규</div></div>';
}
var NOTES={
 A:'이름과 모델명을 두 줄로 쌓아 읽기 쉽게 하고, 가격은 구분선 아래 따로 둡니다. 구조가 가장 단정하지만 높이가 가장 큽니다(약 114px).',
 B:'왼쪽은 "무엇을"(이름·모델), 오른쪽은 "얼마"(가격·배지)로 역할을 나눕니다. 높이 약 84px. 눈이 좌→우로 한 번에 읽힙니다.',
 C:'가격을 맨 위에 크게 두고 이름은 아래 한 줄 요약으로 내립니다. 높이 약 81px로 가장 작고, 계산기에서 가장 중요한 가격이 먼저 보입니다.'
};
function draw(){
  document.getElementById('sheet').innerHTML='<div class="grab"></div><button class="x">&#10005;</button>'+head()
   +'<div class="tabs"><div class="on">계약·관리</div><div class="dim">별매품</div></div>'
   +'<div class="bd"><h4>구매방법</h4><div class="seg"><button class="on">신규(렌탈)</button><button>타사보상</button><button>재렌탈</button><button>일시불</button></div></div>'
   +'<div class="lab">… 이하 본문 (약정기간, 관리방법, 할인 조건 미리보기 …)</div>';
  document.getElementById('note').textContent=NOTES[view];
}
document.querySelectorAll('#vctl button').forEach(function(b){b.onclick=function(){view=b.dataset.v;document.querySelectorAll('#vctl button').forEach(function(x){x.classList.toggle('on',x===b);});draw();};});
document.querySelectorAll('#sctl button').forEach(function(b){b.onclick=function(){chg=+b.dataset.s;document.querySelectorAll('#sctl button').forEach(function(x){x.classList.toggle('on',x===b);});draw();};});
draw();
</script></body></html>
