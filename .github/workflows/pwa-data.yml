name: PWA 가격표 갱신

on:
  repository_dispatch:
    types: [pwa-data]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: pwa-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: data.json 생성
        run: node tools/build-pwa.js
      - name: 변경 있으면 커밋/푸시
        run: |
          if [ -z "$(git status --porcelain pwa)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa
          git commit -m "Update: PWA 가격표 자동 갱신"
          git pull --rebase origin main
          git push origin main
