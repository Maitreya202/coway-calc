<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>제품 관리 — 코웨이 갤러리</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body { font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#f8fafc; color:#0f172a; font-size:14px; min-width:320px; }
.wrap { width:100%; max-width:520px; margin:0 auto; padding:20px 16px 60px; }
h1 { font-size:17px; font-weight:800; margin-bottom:4px; }
.sub { font-size:12px; color:#94a3b8; margin-bottom:20px; }
.card { background:white; border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
input[type=text],input[type=number],input[type=password] { font-family:inherit; font-size:14px; outline:none; border:2px solid #f1f5f9; border-radius:10px; padding:9px 11px; background:white; width:100%; transition:border-color .2s; }
input:focus { border-color:#2563eb; }
label.field { display:block; margin-bottom:10px; }
label.field .lbl { display:block; font-size:11px; font-weight:700; color:#64748b; margin-bottom:4px; }
button { font-family:inherit; cursor:pointer; }
.btn-primary { width:100%; background:#2563eb; color:white; border:none; border-radius:10px; padding:12px; font-size:14px; font-weight:700; }
.btn-primary:disabled { background:#cbd5e1; cursor:not-allowed; }
.btn-secondary { background:#f1f5f9; color:#334155; border:none; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:700; }
.msg { font-size:12px; border-radius:8px; padding:8px 10px; margin-bottom:12px; }
.msg.err { background:#fef2f2; color:#b91c1c; }
.msg.ok { background:#f0fdf4; color:#15803d; }
.result-item { padding:10px 12px; border:1.5px solid #f1f5f9; border-radius:10px; margin-bottom:6px; cursor:pointer; }
.result-item:hover { border-color:#2563eb; }
.result-name { font-weight:700; font-size:13px; }
.result-sub { font-size:11px; color:#94a3b8; margin-top:2px; }
.badge { display:inline-block; background:#eff6ff; color:#1e40af; border-radius:6px; padding:1px 6px; font-size:10px; font-weight:700; margin-right:4px; }
.badge.off { background:#fef2f2; color:#b91c1c; }
.toggle-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid #f1f5f9; margin-top:4px; }
.toggle-row .lbl { font-size:13px; font-weight:700; }
.toggle-row .desc { font-size:11px; color:#94a3b8; margin-top:2px; }
.switch { position:relative; width:44px; height:26px; flex-shrink:0; }
.switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; inset:0; background:#cbd5e1; border-radius:999px; transition:.2s; cursor:pointer; }
.slider:before { content:''; position:absolute; width:20px; height:20px; left:3px; top:3px; background:white; border-radius:50%; transition:.2s; }
.switch input:checked + .slider { background:#2563eb; }
.switch input:checked + .slider:before { transform:translateX(18px); }
.hidden { display:none !important; }
.identity { font-size:12px; color:#475569; line-height:1.6; margin-bottom:10px; }
.back-link { font-size:12px; color:#2563eb; background:none; border:none; padding:0; margin-bottom:14px; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔧 제품 관리</h1>
  <p class="sub">모델별 로우 데이터를 조회하고 시트에 직접 반영합니다</p>

  <!-- 1) 비밀번호 게이트 -->
  <div id="loginView" class="card">
    <label class="field">
      <span class="lbl">관리자 비밀번호</span>
      <input type="password" id="pwInput" autocomplete="off">
    </label>
    <div id="loginMsg"></div>
    <button class="btn-primary" id="loginBtn">확인</button>
  </div>

  <!-- 2) 검색 -->
  <div id="searchView" class="card hidden">
    <label class="field">
      <span class="lbl">모델명 또는 제품명 검색</span>
      <input type="text" id="searchInput" placeholder="예: CHP-7211N">
    </label>
    <div id="searchResults"></div>
  </div>

  <!-- 3) 수정 폼 -->
  <div id="editView" class="card hidden">
    <button class="back-link" id="backBtn">&larr; 검색으로</button>
    <div class="identity" id="identityBox"></div>
    <div id="editMsg"></div>

    <label class="field"><span class="lbl">정상가 (렌탈/월)</span><input type="number" id="f_정상가"></label>
    <label class="field"><span class="lbl">프로모션가 (렌탈/월)</span><input type="number" id="f_프로모션"></label>
    <div class="toggle-row">
      <div><div class="lbl">프로모션 적용</div><div class="desc">끄면 프로모션가가 있어도 정상가로 계산돼요</div></div>
      <label class="switch"><input type="checkbox" id="f_프로모션사용"><span class="slider"></span></label>
    </div>
    <label class="field" style="margin-top:14px"><span class="lbl">재렌탈가 (월)</span><input type="number" id="f_재렌탈"></label>
    <label class="field"><span class="lbl">일시불가</span><input type="number" id="f_일시불"></label>
    <label class="field"><span class="lbl">타사보상 렌탈가 (월)</span><input type="number" id="f_타사보상렌탈"></label>
    <label class="field"><span class="lbl">타사보상 지로가 (월)</span><input type="number" id="f_타사보상지로"></label>
    <label class="field"><span class="lbl">타사보상 일시불가</span><input type="number" id="f_타사보상일시불"></label>
    <label class="field"><span class="lbl">별매품명</span><input type="text" id="f_별매품명"></label>
    <label class="field"><span class="lbl">별매품가 (월)</span><input type="number" id="f_별매품가"></label>
    <label class="field"><span class="lbl">별매품가 재렌탈 (월)</span><input type="number" id="f_별매품가재렌탈"></label>
    <label class="field"><span class="lbl">별매품가 일시불</span><input type="number" id="f_별매품가일시불"></label>

    <button class="btn-primary" id="saveBtn">저장</button>
  </div>
</div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbw_06KQ9F7v2qibjtlrm6s2qfysb0FSaCEVnijccb3-ANZu7ahER0W245c9lYoZ2UMMSA/exec';
var ADMIN_PW = null; // 메모리에만 보관, localStorage/sessionStorage 저장 안 함 — 새로고침하면 다시 입력 필요
var PRODUCTS = [];
var CUR_KEY = null; // 현재 수정 중인 행의 식별 키

var EDITABLE_NUM = ['정상가','프로모션','재렌탈','일시불','타사보상렌탈','타사보상지로','타사보상일시불','별매품가','별매품가재렌탈','별매품가일시불'];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function showMsg(elId, text, ok){
  var el = document.getElementById(elId);
  el.innerHTML = text ? '<div class="msg ' + (ok?'ok':'err') + '">' + esc(text) + '</div>' : '';
}

document.getElementById('loginBtn').onclick = function(){
  var pw = document.getElementById('pwInput').value;
  if (!pw) return;
  this.disabled = true;
  fetch(GAS_URL, {method:'POST', body: JSON.stringify({action:'adminAuth', password:pw})})
    .then(function(r){ return r.json(); })
    .then(function(resp){
      document.getElementById('loginBtn').disabled = false;
      if (resp.ok){
        ADMIN_PW = pw;
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('searchView').classList.remove('hidden');
        loadProducts();
      } else {
        showMsg('loginMsg', '비밀번호가 올바르지 않습니다', false);
      }
    })
    .catch(function(e){
      document.getElementById('loginBtn').disabled = false;
      showMsg('loginMsg', '연결 실패: ' + e.message, false);
    });
};

function loadProducts(){
  fetch(GAS_URL + '?action=getData&_ts=' + Date.now(), {method:'GET', mode:'cors', cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(resp){
      var rows = resp.products || resp;
      PRODUCTS = rows.map(function(r){
        return { s:r[0], 분류:r[1], 모델명:r[2], 제품명:r[3], 관리방법:r[4], 관리주기:r[5],
                 약정년:r[6], 정상가:r[7], 프로모션:r[8], 재렌탈:r[9], 일시불:r[10],
                 타사보상렌탈:r[11]||0, 타사보상지로:r[12]||0, 타사보상일시불:r[13]||0,
                 별매품명:r[14]||'', 별매품가:r[15]||0, 별매품가재렌탈:r[16]||0, 별매품가일시불:r[17]||0,
                 프로모션사용:(r[18]||'Y')!=='N' };
      });
    })
    .catch(function(e){ alert('제품 데이터 로딩 실패: ' + e.message); });
}

document.getElementById('searchInput').addEventListener('input', function(){
  var q = this.value.trim().toLowerCase();
  var el = document.getElementById('searchResults');
  if (!q){ el.innerHTML=''; return; }
  var matched = PRODUCTS.filter(function(p){
    return p.모델명.toLowerCase().indexOf(q)>=0 || p.제품명.toLowerCase().indexOf(q)>=0;
  }).slice(0, 40);
  if (matched.length===0){ el.innerHTML = '<p style="font-size:12px;color:#94a3b8;padding:8px 0">검색 결과가 없습니다</p>'; return; }
  el.innerHTML = matched.map(function(p, i){
    return '<div class="result-item" data-i="' + PRODUCTS.indexOf(p) + '">'
      + '<div class="result-name">' + esc(p.제품명) + ' <span style="color:#94a3b8;font-weight:400">' + esc(p.모델명) + '</span></div>'
      + '<div class="result-sub">'
      + '<span class="badge">' + esc(p.약정년) + '년</span>'
      + '<span class="badge">' + esc(p.관리방법 || '-') + (p.관리주기 && p.관리주기!=='-' ? ' · '+esc(p.관리주기) : '') + '</span>'
      + (p.프로모션사용===false ? '<span class="badge off">프로모션 꺼짐</span>' : '')
      + '</div></div>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('.result-item'), function(node){
    node.onclick = function(){ openEdit(PRODUCTS[Number(this.dataset.i)]); };
  });
});

function openEdit(p){
  CUR_KEY = { 모델명:p.모델명, 제품명:p.제품명, 관리방법:p.관리방법, 관리주기:p.관리주기, 약정년:p.약정년 };
  document.getElementById('identityBox').innerHTML =
    '<b>' + esc(p.제품명) + '</b> · ' + esc(p.모델명) + '<br>'
    + esc(p.분류) + ' · 약정 ' + esc(p.약정년) + '년 · ' + esc(p.관리방법||'-') + (p.관리주기 && p.관리주기!=='-' ? ' · '+esc(p.관리주기) : '');
  EDITABLE_NUM.forEach(function(f){ document.getElementById('f_'+f).value = p[f] || 0; });
  document.getElementById('f_별매품명').value = p.별매품명 || '';
  document.getElementById('f_프로모션사용').checked = p.프로모션사용 !== false;
  showMsg('editMsg', '', false);
  document.getElementById('searchView').classList.add('hidden');
  document.getElementById('editView').classList.remove('hidden');
}

document.getElementById('backBtn').onclick = function(){
  document.getElementById('editView').classList.add('hidden');
  document.getElementById('searchView').classList.remove('hidden');
};

document.getElementById('saveBtn').onclick = function(){
  if (!CUR_KEY) return;
  var fields = {};
  var invalidField = null;
  EDITABLE_NUM.forEach(function(f){
    if (invalidField) return;
    var v = Number(document.getElementById('f_'+f).value);
    if (!isFinite(v) || v < 0){ invalidField = f; return; }
    fields[f] = v;
  });
  if (invalidField){ showMsg('editMsg', invalidField + ' 값이 올바르지 않습니다', false); return; }
  fields.별매품명 = document.getElementById('f_별매품명').value.trim();
  fields.프로모션사용 = document.getElementById('f_프로모션사용').checked ? 'Y' : 'N';

  var btn = this;
  btn.disabled = true;
  fetch(GAS_URL, {method:'POST', body: JSON.stringify({action:'updateProduct', password:ADMIN_PW, key:CUR_KEY, fields:fields})})
    .then(function(r){ return r.json(); })
    .then(function(resp){
      btn.disabled = false;
      if (resp.ok){
        showMsg('editMsg', '저장 완료 — 계산기에는 다음 데이터 새로고침 시 반영됩니다', true);
        // 로컬 목록도 갱신
        var idx = PRODUCTS.findIndex(function(p){
          return p.모델명===CUR_KEY.모델명 && p.제품명===CUR_KEY.제품명 && p.관리방법===CUR_KEY.관리방법 && p.관리주기===CUR_KEY.관리주기 && p.약정년===CUR_KEY.약정년;
        });
        if (idx>=0) Object.assign(PRODUCTS[idx], fields, {프로모션사용: fields.프로모션사용==='Y'});
      } else {
        showMsg('editMsg', resp.error || '저장 실패', false);
      }
    })
    .catch(function(e){
      btn.disabled = false;
      showMsg('editMsg', '연결 실패: ' + e.message, false);
    });
};
</script>
</body>
</html>
