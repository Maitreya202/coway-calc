<div id="pwaDateStrip" style="display:none;text-align:center;font-size:11px;color:#94a3b8;padding:4px 8px;background:#f8fafc"></div>
<div id="pwaUpdateBanner" style="display:none;position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:9998;background:#1e293b;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:92vw">
  <span>새 가격표가 있습니다</span>
  <button onclick="pwaDoUpdate()" style="background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">업데이트</button>
  <button onclick="document.getElementById('pwaUpdateBanner').style.display='none'" style="background:none;border:none;color:#94a3b8;font-size:16px;cursor:pointer;padding:0 2px">&#10005;</button>
</div>
<script>
// ── PWA: 저장된 가격표(data.json) 사용 + 업데이트 알림 (tools/build-pwa.js가 삽입) ──
function pwaFetchData(url, ctl) {
  // 저장본(서비스 워커)/서버의 data.json을 우선 사용, 실패하면 기존 구글 방식으로 폴백
  return fetch(url, {cache:'no-store'}).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r;
  }).catch(function(e){
    return fetch(GAS_URL + '?action=getData&_ts=' + Date.now(), {method:'GET', mode:'cors', redirect:'follow', cache:'no-store', signal: ctl ? ctl.signal : undefined});
  });
}
function pwaDateText(iso) {
  var d = new Date(iso); if (isNaN(d)) return '';
  var p = function(n){ return (n<10?'0':'')+n; };
  return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function pwaAfterLoad() {
  var m = window.__dataMeta;
  var strip = document.getElementById('pwaDateStrip');
  if (m && strip) { strip.textContent = '가격표 기준 ' + pwaDateText(m.updatedAt); strip.style.display = 'block'; }
  var banner = document.getElementById('pwaUpdateBanner');
  if (banner) banner.style.display = 'none';
  // 업데이트 확인(아주 작은 파일) — 오프라인/실패하면 조용히 무시
  fetch('./version.json?_=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : null; }).then(function(v){
    if (v && m && v.version !== m.version && banner) banner.style.display = 'flex';
  }).catch(function(){});
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
}
function pwaDoUpdate() {
  document.getElementById('pwaUpdateBanner').style.display = 'none';
  doUpdate();
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
</script>
