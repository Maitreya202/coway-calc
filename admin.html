<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>제품 관리 — 코웨이 갤러리</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }
body { font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#f8fafc; color:#0f172a; font-size:14px; }
.wrap { width:100%; margin:0 auto; padding:28px 24px 60px; }
.wrap.narrow { max-width:420px; }
h1 { font-size:19px; font-weight:800; margin-bottom:4px; }
.sub { font-size:12px; color:#94a3b8; margin-bottom:20px; }
.card { background:white; border-radius:14px; padding:20px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
input[type=text],input[type=number],input[type=password] { font-family:inherit; font-size:14px; outline:none; border:2px solid #f1f5f9; border-radius:10px; padding:9px 11px; background:white; width:100%; transition:border-color .2s; }
input:focus { border-color:#2563eb; }
label.field { display:block; margin-bottom:10px; }
label.field .lbl { display:block; font-size:11px; font-weight:700; color:#64748b; margin-bottom:4px; }
button { font-family:inherit; cursor:pointer; }
.btn-primary { background:#2563eb; color:white; border:none; border-radius:10px; padding:12px; font-size:14px; font-weight:700; }
.btn-primary:disabled { background:#cbd5e1; cursor:not-allowed; }
.btn-secondary { background:#f1f5f9; color:#334155; border:none; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:700; }
.msg { font-size:12px; border-radius:8px; padding:8px 10px; margin-bottom:12px; }
.msg.err { background:#fef2f2; color:#b91c1c; }
.msg.ok { background:#f0fdf4; color:#15803d; }
.result-item { padding:10px 14px; border:1.5px solid #f1f5f9; border-radius:10px; margin-bottom:6px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.result-item:hover { border-color:#2563eb; }
.result-name { font-weight:700; font-size:13px; }
.result-sub { font-size:11px; color:#94a3b8; margin-top:2px; }
.result-count { font-size:11px; color:#2563eb; font-weight:700; background:#eff6ff; border-radius:999px; padding:3px 9px; white-space:nowrap; }
.badge { display:inline-block; background:#eff6ff; color:#1e40af; border-radius:6px; padding:1px 6px; font-size:10px; font-weight:700; margin-right:4px; }
.badge.off { background:#fef2f2; color:#b91c1c; }
.hidden { display:none !important; }
.identity { font-size:13px; color:#475569; line-height:1.6; margin-bottom:14px; }
.back-link { font-size:12px; color:#2563eb; background:none; border:none; padding:0; margin-bottom:14px; font-weight:700; }
.tbl-wrap { overflow-x:auto; }
table.edit-tbl { border-collapse:collapse; width:100%; font-size:12px; white-space:nowrap; }
table.edit-tbl th, table.edit-tbl td { border:1px solid #eef1f5; padding:6px 7px; text-align:left; }
table.edit-tbl th { background:#f8fafc; color:#64748b; font-weight:700; font-size:11px; position:sticky; top:0; }
table.edit-tbl td.id-col { color:#334155; font-weight:600; background:#fafbfc; }
table.edit-tbl input[type=number] { width:90px; padding:5px 6px; font-size:12px; border-radius:6px; }
table.edit-tbl input[type=text] { width:130px; padding:5px 6px; font-size:12px; border-radius:6px; }
table.edit-tbl input.dirty { border-color:#f59e0b; background:#fffbeb; }
.promo-toggle { display:flex; align-items:center; gap:4px; }
.switch { display:inline-block; position:relative; width:36px; height:20px; flex-shrink:0; }
.switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; inset:0; background:#cbd5e1; border-radius:999px; transition:.2s; cursor:pointer; }
.slider:before { content:''; position:absolute; width:14px; height:14px; left:3px; top:3px; background:white; border-radius:50%; transition:.2s; }
.switch input:checked + .slider { background:#2563eb; }
.switch input:checked + .slider:before { transform:translateX(16px); }
.row-save-btn { background:#2563eb; color:white; border:none; border-radius:6px; padding:6px 10px; font-size:11px; font-weight:700; }
.row-save-btn:disabled { background:#cbd5e1; }
.row-msg { font-size:10px; margin-top:3px; }
.row-msg.ok { color:#15803d; }
.row-msg.err { color:#b91c1c; }
tr.row-saved td { background:#f0fdf4; }
</style>
</head>
<body>
<div class="wrap narrow" id="loginWrap">
  <h1>🔧 제품 관리</h1>
  <p class="sub">모델별 로우 데이터를 조회하고 시트에 직접 반영합니다 (PC 전용)</p>
  <div id="loginView" class="card">
    <label class="field">
      <span class="lbl">관리자 비밀번호</span>
      <input type="password" id="pwInput" autocomplete="off">
    </label>
    <div id="loginMsg"></div>
    <button class="btn-primary" id="loginBtn" style="width:100%">확인</button>
  </div>
</div>

<div class="wrap hidden" id="mainWrap">
  <h1>🔧 제품 관리</h1>
  <p class="sub">모델별 로우 데이터를 조회하고 시트에 직접 반영합니다</p>

  <!-- 검색 -->
  <div id="searchView" class="card">
    <label class="field">
      <span class="lbl">모델명 또는 제품명 검색</span>
      <input type="text" id="searchInput" placeholder="예: CHP-7211N">
    </label>
    <div id="searchResults"></div>
  </div>

  <!-- 표 편집 -->
  <div id="tableView" class="card hidden">
    <button class="back-link" id="backBtn">&larr; 검색으로</button>
    <div class="identity" id="identityBox"></div>
    <div class="tbl-wrap">
      <table class="edit-tbl" id="editTable"></table>
    </div>
  </div>
</div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbw_06KQ9F7v2qibjtlrm6s2qfysb0FSaCEVnijccb3-ANZu7ahER0W245c9lYoZ2UMMSA/exec';
var ADMIN_PW = null; // 메모리에만 보관, localStorage/sessionStorage 저장 안 함 — 새로고침하면 다시 입력 필요
var PRODUCTS = [];
var CUR_ROWS = []; // 현재 표에 펼쳐진 행들(제품명+모델명 일치)

var EDITABLE_NUM = ['정상가','프로모션','재렌탈','타사보상렌탈','일시불','타사보상일시불'];
var TOGGLE_FIELDS = ['프로모션사용','타사보상사용','재렌탈사용'];
var COLS = [
  {f:'관리방법', label:'관리방법', id:true},
  {f:'관리주기', label:'관리주기', id:true},
  {f:'약정년',   label:'약정(년)', id:true},
  {f:'정상가',   label:'정상가', num:true},
  {f:'프로모션', label:'프로모션가', num:true},
  {f:'재렌탈',   label:'재렌탈가', num:true},
  {f:'타사보상렌탈', label:'타사보상', num:true},
  {f:'일시불',   label:'일시불가', num:true},
  {f:'타사보상일시불', label:'타사보상 일시불', num:true},
  {f:'프로모션사용', label:'프로모션 사용', toggle:true},
  {f:'타사보상사용', label:'타사보상 사용', toggle:true},
  {f:'재렌탈사용', label:'재렌탈 사용', toggle:true}
];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function showMsg(elId, text, ok){
  var el = document.getElementById(elId);
  el.innerHTML = text ? '<div class="msg ' + (ok?'ok':'err') + '">' + esc(text) + '</div>' : '';
}

document.getElementById('loginBtn').onclick = function(){
  var pw = document.getElementById('pwInput').value;
  if (!pw) return;
  this.disabled = true;
  fetch(GAS_URL, {method:'POST', body: JSON.stringify({action:'adminAuth', password:pw})})
    .then(function(r){ return r.json(); })
    .then(function(resp){
      document.getElementById('loginBtn').disabled = false;
      if (resp.ok){
        ADMIN_PW = pw;
        document.getElementById('loginWrap').classList.add('hidden');
        document.getElementById('mainWrap').classList.remove('hidden');
        loadProducts();
      } else {
        showMsg('loginMsg', '비밀번호가 올바르지 않습니다', false);
      }
    })
    .catch(function(e){
      document.getElementById('loginBtn').disabled = false;
      showMsg('loginMsg', '연결 실패: ' + e.message, false);
    });
};

function loadProducts(){
  fetch(GAS_URL + '?action=getData&_ts=' + Date.now(), {method:'GET', mode:'cors', cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(resp){
      var rows = resp.products || resp;
      PRODUCTS = rows.map(function(r){
        return { s:r[0], 분류:r[1], 모델명:r[2], 제품명:r[3], 관리방법:r[4], 관리주기:r[5],
                 약정년:r[6], 정상가:r[7], 프로모션:r[8], 재렌탈:r[9], 일시불:r[10],
                 타사보상렌탈:r[11]||0, 타사보상일시불:r[12]||0,
                 프로모션사용:(r[13]||'Y')!=='N', 타사보상사용:(r[14]||'Y')!=='N', 재렌탈사용:(r[15]||'Y')!=='N' };
      });
    })
    .catch(function(e){ alert('제품 데이터 로딩 실패: ' + e.message); });
}

// 검색 결과는 제품명+모델명 기준으로 묶어서 보여줌 (약정/관리방법별로 안 쪼개짐)
function groupedProducts(){
  var seen = {}, list = [];
  PRODUCTS.forEach(function(p){
    var key = p.제품명 + '|' + p.모델명;
    if (!seen[key]) {
      seen[key] = true;
      list.push({ 제품명:p.제품명, 모델명:p.모델명, 분류:p.분류, cnt:0, hasPromoOff:false });
    }
  });
  var idx = {};
  list.forEach(function(g, i){ idx[g.제품명+'|'+g.모델명] = i; });
  PRODUCTS.forEach(function(p){
    var g = list[idx[p.제품명+'|'+p.모델명]];
    g.cnt++;
    if (p.프로모션사용===false) g.hasPromoOff = true;
  });
  return list;
}

document.getElementById('searchInput').addEventListener('input', function(){
  var q = this.value.trim().toLowerCase();
  var el = document.getElementById('searchResults');
  if (!q){ el.innerHTML=''; return; }
  var matched = groupedProducts().filter(function(p){
    return p.모델명.toLowerCase().indexOf(q)>=0 || p.제품명.toLowerCase().indexOf(q)>=0;
  }).slice(0, 40);
  if (matched.length===0){ el.innerHTML = '<p style="font-size:12px;color:#94a3b8;padding:8px 0">검색 결과가 없습니다</p>'; return; }
  el.innerHTML = matched.map(function(g, i){
    return '<div class="result-item" data-i="' + i + '">'
      + '<div>'
      + '<div class="result-name">' + esc(g.제품명) + ' <span style="color:#94a3b8;font-weight:400">' + esc(g.모델명) + '</span></div>'
      + '<div class="result-sub">' + esc(g.분류) + (g.hasPromoOff ? ' <span class="badge off">프로모션 꺼진 행 있음</span>' : '') + '</div>'
      + '</div>'
      + '<span class="result-count">' + g.cnt + '개 행</span>'
      + '</div>';
  }).join('');
  var list = matched;
  Array.prototype.forEach.call(el.querySelectorAll('.result-item'), function(node){
    node.onclick = function(){ openTable(list[Number(this.dataset.i)]); };
  });
});

function openTable(g){
  CUR_ROWS = PRODUCTS.filter(function(p){ return p.제품명===g.제품명 && p.모델명===g.모델명; })
    .sort(function(a,b){
      return (a.관리방법||'').localeCompare(b.관리방법||'') || (a.관리주기||'').localeCompare(b.관리주기||'') || (a.약정년-b.약정년);
    });
  document.getElementById('identityBox').innerHTML = '<b>' + esc(g.제품명) + '</b> · ' + esc(g.모델명) + ' · ' + esc(g.분류) + ' · 총 ' + CUR_ROWS.length + '개 행';
  renderTable();
  document.getElementById('searchView').classList.add('hidden');
  document.getElementById('tableView').classList.remove('hidden');
}

document.getElementById('backBtn').onclick = function(){
  document.getElementById('tableView').classList.add('hidden');
  document.getElementById('searchView').classList.remove('hidden');
};

function renderTable(){
  var t = document.getElementById('editTable');
  var h = '<thead><tr>';
  COLS.forEach(function(c){ h += '<th>' + esc(c.label) + '</th>'; });
  h += '<th></th></tr></thead><tbody>';
  CUR_ROWS.forEach(function(row, ri){
    h += '<tr data-ri="' + ri + '">';
    COLS.forEach(function(c){
      var v = row[c.f];
      if (c.id) {
        h += '<td class="id-col">' + esc(c.f==='약정년' ? v+'년' : (v||'-')) + '</td>';
      } else if (c.toggle) {
        h += '<td><label class="switch"><input type="checkbox" data-f="' + c.f + '"' + (v!==false?' checked':'') + '><span class="slider"></span></label></td>';
      } else if (c.num) {
        h += '<td><input type="number" data-f="' + c.f + '" value="' + esc(v||0) + '"></td>';
      } else {
        h += '<td><input type="text" data-f="' + c.f + '" value="' + esc(v||'') + '"></td>';
      }
    });
    h += '<td><button class="row-save-btn" data-ri="' + ri + '">저장</button><div class="row-msg" data-ri="' + ri + '"></div></td>';
    h += '</tr>';
  });
  h += '</tbody>';
  t.innerHTML = h;

  Array.prototype.forEach.call(t.querySelectorAll('input[data-f]'), function(inp){
    inp.addEventListener('input', function(){ inp.classList.add('dirty'); });
    inp.addEventListener('change', function(){ inp.classList.add('dirty'); });
  });
  Array.prototype.forEach.call(t.querySelectorAll('.row-save-btn'), function(btn){
    btn.onclick = function(){ saveRow(Number(this.dataset.ri), this); };
  });
}

function saveRow(ri, btn){
  var row = CUR_ROWS[ri];
  var tr = document.querySelector('tr[data-ri="' + ri + '"]');
  var fields = {};
  var invalidField = null;

  EDITABLE_NUM.forEach(function(f){
    var inp = tr.querySelector('input[data-f="' + f + '"]');
    if (!inp) return;
    var v = Number(inp.value);
    if (!isFinite(v) || v < 0) { invalidField = f; return; }
    fields[f] = v;
  });
  var toggleFields = {};
  TOGGLE_FIELDS.forEach(function(f){
    var inp = tr.querySelector('input[data-f="' + f + '"]');
    if (!inp) return;
    fields[f] = inp.checked ? 'Y' : 'N';
    toggleFields[f] = inp.checked;
  });

  var msgEl = document.querySelector('.row-msg[data-ri="' + ri + '"]');
  if (invalidField) { msgEl.textContent = invalidField + ' 값 오류'; msgEl.className = 'row-msg err'; return; }

  var key = { 모델명:row.모델명, 제품명:row.제품명, 관리방법:row.관리방법, 관리주기:row.관리주기, 약정년:row.약정년 };
  btn.disabled = true;
  msgEl.textContent = '저장 중...'; msgEl.className = 'row-msg';
  fetch(GAS_URL, {method:'POST', body: JSON.stringify({action:'updateProduct', password:ADMIN_PW, key:key, fields:fields})})
    .then(function(r){ return r.json(); })
    .then(function(resp){
      btn.disabled = false;
      if (resp.ok){
        msgEl.textContent = '저장 완료'; msgEl.className = 'row-msg ok';
        tr.classList.add('row-saved');
        Array.prototype.forEach.call(tr.querySelectorAll('input.dirty'), function(inp){ inp.classList.remove('dirty'); });
        Object.assign(row, fields, toggleFields);
        var idx = PRODUCTS.findIndex(function(p){
          return p.모델명===key.모델명 && p.제품명===key.제품명 && p.관리방법===key.관리방법 && p.관리주기===key.관리주기 && p.약정년===key.약정년;
        });
        if (idx>=0) Object.assign(PRODUCTS[idx], fields, toggleFields);
      } else {
        msgEl.textContent = resp.error || '저장 실패'; msgEl.className = 'row-msg err';
      }
    })
    .catch(function(e){
      btn.disabled = false;
      msgEl.textContent = '연결 실패: ' + e.message; msgEl.className = 'row-msg err';
    });
}
</script>
</body>
</html>
